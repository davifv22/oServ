openapi: 3.0.3
info:
  title: oServ API (Refatorado)
  version: "1.0.1"
  description: |
    Documentação atualizada da API do sistema **oServ** após a refatoração.  
    As rotas continuam prefixadas por `/api`, conforme o arquivo `app.ts`【958971593870761†L17-L33】.  
    Esta especificação descreve todos os endpoints disponíveis, os modelos de dados e as respostas.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desenvolvimento

paths:
  /boletos:
    get:
      summary: Listar boletos
      description: Retorna todos os boletos existentes【958971593870761†L19-L31】. Cada boleto contém dados de valor, vencimento e relacionamentos com clientes e requerimentos【338594470086647†L6-L47】.
      responses:
        "200":
          description: Lista de boletos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Boleto'
        "204":
          description: Nenhum boleto encontrado
  /boletos-servicos:
    get:
      summary: Listar boletos por serviço
      description: Recupera registros de serviços vinculados a boletos【895649798174835†L5-L47】.
      responses:
        "200":
          description: Lista de boletos-serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoletoServico'
        "204":
          description: Nenhum registro encontrado
  /clientes:
    get:
      summary: Listar clientes
      description: Retorna todos os clientes cadastrados【744901310195182†L3-L59】.
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        "204":
          description: Nenhum cliente encontrado
  /controles:
    get:
      summary: Listar controles do sistema
      description: Exibe os registros de controle, como a versão do sistema【124848214801143†L3-L17】.
      responses:
        "200":
          description: Lista de controles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Controle'
        "204":
          description: Nenhum controle encontrado
  /empresa:
    get:
      summary: Obter dados da empresa
      description: Retorna os dados da empresa configurada【627712243301178†L3-L43】.
      responses:
        "200":
          description: Dados da empresa retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
        "204":
          description: Nenhum registro encontrado
  /equipes:
    get:
      summary: Listar equipes
      description: Retorna todas as equipes existentes, incluindo o setor e a situação【893009957163900†L4-L43】.
      responses:
        "200":
          description: Lista de equipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipe'
        "204":
          description: Nenhuma equipe encontrada
  /funcionarios:
    get:
      summary: Listar funcionários
      description: Retorna todos os funcionários cadastrados【690778012733600†L5-L66】.
      responses:
        "200":
          description: Lista de funcionários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcionario'
        "204":
          description: Nenhum funcionário encontrado
  /ordens-servicos:
    get:
      summary: Listar ordens de serviço
      description: Retorna todas as ordens de serviço abertas ou concluídas【667099911598614†L6-L85】.
      responses:
        "200":
          description: Lista de ordens de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdemServico'
        "204":
          description: Nenhuma ordem encontrada
  /pre-orcamentos:
    get:
      summary: Listar pré‑orçamentos
      description: Retorna todos os pré‑orçamentos cadastrados【133890943648202†L3-L42】.
      responses:
        "200":
          description: Lista de pré‑orçamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrcamento'
        "204":
          description: Nenhum pré‑orçamento encontrado
  /requerimentos:
    get:
      summary: Listar requerimentos
      description: Retorna todos os requerimentos registrados【78070113188095†L6-L88】.
      responses:
        "200":
          description: Lista de requerimentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Requerimento'
        "204":
          description: Nenhum requerimento encontrado
  /servicos:
    get:
      summary: Listar serviços
      description: Retorna todos os serviços cadastrados【458227734551936†L3-L41】.
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servico'
        "204":
          description: Nenhum serviço encontrado
  /setores:
    get:
      summary: Listar setores
      description: Retorna todos os setores existentes【936666573802810†L3-L28】.
      responses:
        "200":
          description: Lista de setores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setor'
        "204":
          description: Nenhum setor encontrado
  /tipos-requerimentos:
    get:
      summary: Listar tipos de requerimentos
      description: Retorna todos os tipos de requerimento disponíveis【287770204310926†L3-L39】.
      responses:
        "200":
          description: Lista de tipos de requerimentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoRequerimento'
        "204":
          description: Nenhum tipo encontrado
  /usuarios:
    get:
      summary: Listar usuários
      description: Retorna todos os usuários cadastrados【356398610036450†L3-L58】.
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        "204":
          description: Nenhum usuário encontrado
  /veiculos:
    get:
      summary: Listar veículos
      description: Retorna todos os veículos cadastrados【507380931529015†L3-L51】.
      responses:
        "200":
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
        "204":
          description: Nenhum veículo encontrado

