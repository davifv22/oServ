openapi: 3.0.3
info:
  title: oServ API
  version: "1.0.0"
  description: |
    Esta especificação OpenAPI documenta a API do sistema **oServ**.  
    O serviço expõe recursos de boletos, boletos‑serviços, clientes, controles, empresa, equipes, funcionários, ordens de serviços, pré‑orçamentos, requerimentos, serviços, setores, tipos de requerimentos, usuários e veículos.  
    Todas as rotas abaixo são prefixadas pelo caminho base `/api` conforme definido no arquivo `app.ts`【18561569972942†L17-L33】.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desenvolvimento

paths:
  /boletos:
    get:
      summary: Lista de boletos
      description: Retorna todos os boletos cadastrados no sistema.  Cada boleto registra valores, vencimento, situação e relaciona‑se a um requerimento e cliente【338594470086647†L6-L47】.
      responses:
        "200":
          description: Lista de boletos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Boleto'
        "204":
          description: Nenhum boleto encontrado
  /boletos-servicos:
    get:
      summary: Lista de boletos por serviço
      description: Retorna todos os registros que relacionam boletos a serviços【895649798174835†L5-L47】.
      responses:
        "200":
          description: Lista de boletos‑serviços retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoletoServico'
        "204":
          description: Nenhum registro encontrado
  /clientes:
    get:
      summary: Lista de clientes
      description: Retorna todos os clientes cadastrados【744901310195182†L3-L59】.
      responses:
        "200":
          description: Lista de clientes retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        "204":
          description: Nenhum cliente encontrado
  /controles:
    get:
      summary: Versões de sistema
      description: Retorna os registros de controle contendo a versão do sistema【124848214801143†L3-L17】.
      responses:
        "200":
          description: Lista de registros de controle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Controle'
        "204":
          description: Nenhum controle encontrado
  /empresa:
    get:
      summary: Dados da empresa
      description: Retorna os dados da empresa cadastrada【107465177237162†L3-L43】.
      responses:
        "200":
          description: Dados da empresa retornados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
        "204":
          description: Nenhum registro encontrado
  /equipes:
    get:
      summary: Lista de equipes
      description: Retorna todas as equipes existentes, indicando setor e situação【893009957163900†L4-L43】.
      responses:
        "200":
          description: Lista de equipes retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipe'
        "204":
          description: Nenhuma equipe encontrada
  /funcionarios:
    get:
      summary: Lista de funcionários
      description: Retorna todos os funcionários cadastrados【690778012733600†L5-L66】.
      responses:
        "200":
          description: Lista de funcionários retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcionario'
        "204":
          description: Nenhum funcionário encontrado
  /ordens-servicos:
    get:
      summary: Lista de ordens de serviço
      description: Retorna todas as ordens de serviço emitidas【667099911598614†L6-L85】.
      responses:
        "200":
          description: Lista de ordens de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdemServico'
        "204":
          description: Nenhuma ordem encontrada
  /pre-orcamentos:
    get:
      summary: Lista de pré‑orçamentos
      description: Retorna todos os pré‑orçamentos cadastrados【133890943648202†L3-L42】.
      responses:
        "200":
          description: Lista de pré‑orçamentos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrcamento'
        "204":
          description: Nenhum pré‑orçamento encontrado
  /requerimentos:
    get:
      summary: Lista de requerimentos
      description: Retorna todos os requerimentos registrados no sistema【78070113188095†L6-L88】.
      responses:
        "200":
          description: Lista de requerimentos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Requerimento'
        "204":
          description: Nenhum requerimento encontrado
  /servicos:
    get:
      summary: Lista de serviços
      description: Retorna todos os serviços disponíveis【458227734551936†L3-L41】.
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servico'
        "204":
          description: Nenhum serviço encontrado
  /setores:
    get:
      summary: Lista de setores
      description: Retorna todos os setores cadastrados【936666573802810†L3-L28】.
      responses:
        "200":
          description: Lista de setores retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setor'
        "204":
          description: Nenhum setor encontrado
  /tipos-requerimentos:
    get:
      summary: Lista de tipos de requerimentos
      description: Retorna todos os tipos de requerimento disponíveis【287770204310926†L3-L39】.
      responses:
        "200":
          description: Lista de tipos de requerimento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoRequerimento'
        "204":
          description: Nenhum tipo encontrado
  /usuarios:
    get:
      summary: Lista de usuários
      description: Retorna todos os usuários cadastrados【356398610036450†L3-L58】.
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        "204":
          description: Nenhum usuário encontrado
  /veiculos:
    get:
      summary: Lista de veículos
      description: Retorna todos os veículos cadastrados【507380931529015†L3-L51】.
      responses:
        "200":
          description: Lista de veículos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
        "204":
          description: Nenhum veículo encontrado

