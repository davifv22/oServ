openapi: 3.0.3
info:
  title: oServ API (Next.js)
  version: "1.0.0"
  description: |
    Documentação da API do sistema **oServ** após a migração para **Next.js Fullstack**.  
    Todas as rotas de API estão sob o prefixo `/api` e seguem a arquitetura multiempresa descrita nos documentos do projeto.  
    As principais rotas listadas no arquivo `README.md` incluem autenticação, gerenciamento da empresa, perfis, cadastros, ordens de serviço, comentários e notificações【890973672335846†L291-L352】.  
    Esta especificação também considera as entidades e campos sugeridos na proposta de arquitetura SaaS multiempresa【169360353382499†L31-L120】.
servers:
  - url: http://localhost:3000
    description: Servidor local de desenvolvimento

paths:
  ## ------------------------
  ## Autenticação
  ## ------------------------
  /api/subdomain/check:
    get:
      summary: Verificar disponibilidade de subdomínio
      description: |
        Verifica se um subdomínio informado está disponível ou já existe para cadastro.  
        Esta rota é pública e não exige autenticação.  
        A rota é citada no middleware e no fluxo de registro da empresa【4745690822504†L80-L101】.
      parameters:
        - name: subdomain
          in: query
          required: true
          schema:
            type: string
          description: Subdomínio desejado, sem o sufixo de domínio.
      responses:
        "200":
          description: Resultado da verificação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdomainCheckResponse'
  /api/auth/register-company:
    post:
      summary: Registrar empresa e usuário proprietário
      description: |
        Cria uma nova empresa assinante, cadastra o usuário **OWNER** e inicia a assinatura inicial.  
        O endpoint é listado como rota principal para autenticação【890973672335846†L291-L299】 e recomendado para o fluxo de primeiro registro【169360353382499†L152-L160】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyRequest'
      responses:
        "201":
          description: Empresa criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompanyResponse'
        "400":
          description: Dados inválidos ou subdomínio indisponível
  /api/auth/login:
    post:
      summary: Autenticar usuário
      description: |
        Efetua o login de um usuário existente. Retorna um token de autenticação (cookie HTTP-only) e redirecionamento para o dashboard apropriado.  
        Rota listada na seção de autenticação【890973672335846†L291-L299】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Credenciais inválidas
  /api/auth/logout:
    post:
      summary: Sair da sessão atual
      description: |
        Encerra a sessão do usuário removendo o cookie de autenticação.  
        Rota listada como parte das APIs de autenticação【890973672335846†L291-L299】.
      responses:
        "204":
          description: Logout realizado com sucesso

  ## ------------------------
  ## Empresa e Perfil
  ## ------------------------
  /api/company:
    get:
      summary: Obter dados da empresa atual
      description: |
        Retorna as informações da empresa autenticada.  
        Rota citada em `README.md`【890973672335846†L302-L308】.
      responses:
        "200":
          description: Dados da empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar dados da empresa
      description: |
        Atualiza os dados da empresa atual.  
        Os campos enviados no corpo substituirão os valores existentes.  
        Rota citada em `README.md`【890973672335846†L302-L308】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        "200":
          description: Empresa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
  /api/profile:
    get:
      summary: Obter perfil do usuário
      description: |
        Retorna as informações do usuário autenticado.  
        Rota citada em `README.md`【890973672335846†L302-L308】.
      responses:
        "200":
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar perfil do usuário
      description: |
        Atualiza dados do usuário autenticado, como nome, email ou senha.  
        Rota citada em `README.md`【890973672335846†L302-L308】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado

  ## ------------------------
  ## Cadastros: Clientes
  ## ------------------------
  /api/customers:
    get:
      summary: Listar clientes
      description: |
        Retorna todos os clientes cadastrados da empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L310-L327】.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: Página para paginação (opcional).
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
          description: Quantidade de itens por página (opcional).
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        "401":
          description: Não autenticado
    post:
      summary: Cadastrar cliente
      description: |
        Cria um novo cliente para a empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L310-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        "201":
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar cliente
      description: |
        Atualiza os dados de um cliente existente. O corpo deve conter o identificador do cliente e os campos a serem atualizados.  
        Endpoint listado em `README.md`【890973672335846†L310-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    delete:
      summary: Excluir cliente
      description: |
        Remove um cliente pelo identificador informado na query string.  
        Endpoint listado em `README.md`【890973672335846†L310-L327】.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Identificador do cliente a ser removido.
      responses:
        "204":
          description: Cliente excluído com sucesso
        "401":
          description: Não autenticado
  /api/customers/{id}/create-access:
    post:
      summary: Criar acesso de portal para cliente
      description: |
        Gera um usuário e credenciais de acesso para um cliente existente, permitindo que ele acompanhe serviços pelo portal.  
        Esta rota é recomendada no documento de arquitetura SaaS【169360353382499†L175-L183】.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador do cliente.
      responses:
        "200":
          description: Acesso criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado

  ## ------------------------
  ## Cadastros: Funcionários
  ## ------------------------
  /api/employees:
    get:
      summary: Listar funcionários
      description: |
        Retorna todos os funcionários cadastrados da empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L318-L327】.
      responses:
        "200":
          description: Lista de funcionários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        "401":
          description: Não autenticado
    post:
      summary: Cadastrar funcionário
      description: |
        Cria um novo funcionário para a empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L318-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        "201":
          description: Funcionário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar funcionário
      description: |
        Atualiza os dados de um funcionário existente.  
        Endpoint listado em `README.md`【890973672335846†L318-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        "200":
          description: Funcionário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    delete:
      summary: Excluir funcionário
      description: |
        Remove um funcionário pelo identificador informado na query string.  
        Endpoint listado em `README.md`【890973672335846†L318-L327】.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Identificador do funcionário a ser removido.
      responses:
        "204":
          description: Funcionário removido
        "401":
          description: Não autenticado
  /api/employees/{id}/create-access:
    post:
      summary: Criar acesso de usuário para funcionário
      description: |
        Gera um usuário com credenciais de sistema para um funcionário existente.  
        Esta rota é recomendada no documento de arquitetura SaaS【169360353382499†L175-L183】.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador do funcionário.
      responses:
        "200":
          description: Acesso criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado

  ## ------------------------
  ## Cadastros: Serviços
  ## ------------------------
  /api/services:
    get:
      summary: Listar serviços
      description: |
        Retorna todos os serviços cadastrados da empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L323-L327】.
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        "401":
          description: Não autenticado
    post:
      summary: Cadastrar serviço
      description: |
        Cria um novo serviço para a empresa autenticada.  
        Endpoint listado em `README.md`【890973672335846†L323-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        "201":
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar serviço
      description: |
        Atualiza os dados de um serviço existente.  
        Endpoint listado em `README.md`【890973672335846†L323-L327】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
      responses:
        "200":
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    delete:
      summary: Excluir serviço
      description: |
        Remove um serviço pelo identificador informado na query string.  
        Endpoint listado em `README.md`【890973672335846†L323-L327】.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Identificador do serviço a ser removido.
      responses:
        "204":
          description: Serviço removido
        "401":
          description: Não autenticado

  ## ------------------------
  ## Ordens de serviço
  ## ------------------------
  /api/service-orders:
    get:
      summary: Listar ordens de serviço
      description: |
        Retorna todas as ordens de serviço da empresa autenticada.  
        Filtros opcionais permitem listar por status ou por responsável【890973672335846†L331-L343】.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
          description: Filtrar pelo status da ordem.
        - name: responsibleEmployeeId
          in: query
          required: false
          schema:
            type: string
          description: Filtrar ordens pelo ID do funcionário responsável.
      responses:
        "200":
          description: Lista de ordens de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOrder'
        "401":
          description: Não autenticado
    post:
      summary: Cadastrar ordem de serviço
      description: |
        Cria uma nova ordem de serviço.  
        Endpoint listado em `README.md`【890973672335846†L331-L337】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderCreateRequest'
      responses:
        "201":
          description: Ordem de serviço criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    patch:
      summary: Atualizar ordem de serviço
      description: |
        Atualiza dados de uma ordem de serviço existente, como status ou informações adicionais.  
        Endpoint listado em `README.md`【890973672335846†L331-L337】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderUpdateRequest'
      responses:
        "200":
          description: Ordem de serviço atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado
    delete:
      summary: Excluir ordem de serviço
      description: |
        Remove uma ordem de serviço pelo ID informado na query string.  
        Endpoint listado em `README.md`【890973672335846†L331-L337】.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Identificador da ordem de serviço.
      responses:
        "204":
          description: Ordem removida
        "401":
          description: Não autenticado
  /api/service-orders/{id}/comments:
    get:
      summary: Listar comentários da ordem
      description: |
        Retorna todos os comentários associados a uma ordem de serviço.  
        Endpoint listado em `README.md`【890973672335846†L345-L352】.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador da ordem de serviço.
      responses:
        "200":
          description: Lista de comentários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        "401":
          description: Não autenticado
    post:
      summary: Adicionar comentário à ordem
      description: |
        Adiciona um novo comentário à ordem de serviço especificada.  
        Endpoint listado em `README.md`【890973672335846†L345-L352】.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador da ordem de serviço.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        "201":
          description: Comentário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado

  ## ------------------------
  ## Notificações
  ## ------------------------
  /api/notifications:
    get:
      summary: Listar notificações
      description: |
        Retorna todas as notificações internas do usuário autenticado.  
        Endpoint listado em `README.md`【890973672335846†L345-L352】.
      responses:
        "200":
          description: Lista de notificações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        "401":
          description: Não autenticado
    patch:
      summary: Marcar notificações como lidas
      description: |
        Atualiza o status de uma ou mais notificações para lidas.  
        Endpoint listado em `README.md`【890973672335846†L345-L352】.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Lista de IDs de notificações a serem marcadas como lidas.
              required:
                - ids
      responses:
        "200":
          description: Notificações atualizadas
        "400":
          description: Dados inválidos
        "401":
          description: Não autenticado

  ## ------------------------
  ## Planos de assinatura e usuário atual
  ## ------------------------
  /api/subscription-plans:
    get:
      summary: Listar planos de assinatura
      description: |
        Retorna todos os planos de assinatura disponíveis para contratação.  
        Rota recomendada na arquitetura SaaS【169360353382499†L105-L120】.
      responses:
        "200":
          description: Lista de planos de assinatura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
  /api/me:
    get:
      summary: Obter informações do usuário autenticado
      description: |
        Retorna as informações básicas do usuário autenticado, incluindo ID, nome, email, papel e ID da empresa.  
        Rota recomendada na arquitetura SaaS【169360353382499†L175-L183】.
      responses:
        "200":
          description: Dados do usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        "401":
          description: Não autenticado

components:
  schemas:
    ## Tipos auxiliares
    PlanId:
      type: string
      description: Plano de assinatura escolhido.
      enum:
        - STARTER
        - PRO
        - ENTERPRISE
    Role:
      type: string
      description: Papel do usuário no sistema【169360353382499†L25-L29】.
      enum:
        - OWNER
        - ADMIN
        - EMPLOYEE
        - CUSTOMER
    Status:
      type: string
      description: Status genérico (ativo/inativo).
      enum:
        - ACTIVE
        - INACTIVE
    OrderStatus:
      type: string
      description: Status de uma ordem de serviço.
      enum:
        - OPEN
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
    SubdomainCheckResponse:
      type: object
      properties:
        available:
          type: boolean
          description: Indica se o subdomínio está disponível para uso.
        exists:
          type: boolean
          description: Indica se o subdomínio já existe.
        reason:
          type: string
          description: Motivo da indisponibilidade, quando aplicável.
      required:
        - available
    AuthPayload:
      type: object
      description: Dados presentes no token de autenticação【4745690822504†L138-L239】.
      properties:
        userId:
          type: string
        companyId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        subdomain:
          type: string
      required:
        - userId
        - companyId
        - role
        - subdomain
    ## Entidades principais
    Company:
      type: object
      description: Entidade empresa assinante【169360353382499†L33-L47】.
      properties:
        id:
          type: string
        name:
          type: string
        tradeName:
          type: string
        document:
          type: string
          description: CNPJ ou CPF.
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        subdomain:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - document
        - subdomain
        - status
    User:
      type: object
      description: Entidade usuário【169360353382499†L49-L64】.
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/Status'
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - name
        - email
        - role
        - status
    Customer:
      type: object
      description: Entidade cliente【169360353382499†L66-L80】.
      properties:
        id:
          type: string
        companyId:
          type: string
        userId:
          type: string
          nullable: true
        name:
          type: string
        document:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - name
    Employee:
      type: object
